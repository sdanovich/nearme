# NearMe's backend only. Postgres + Redis are no longer owned here — they live in
# the shared infra stack (~/projects/infra) on the external `shared-net` network.
# The backend reaches them by service name (postgres/redis). NearMe owns just its
# own `nearmedb` database on that shared server.
#
#   (start the shared infra first:  cd ../infra && docker compose up -d)
#   docker compose up -d
services:
  backend:
    build: ./backend
    container_name: nearme-backend
    # Postgres/Redis are external (a separate compose project), so cross-project
    # depends_on health-gating isn't possible. Instead the entrypoint below blocks
    # until both accept connections before starting the app (no crash-looping); the
    # restart policy is the backstop. The base image ships bash (/dev/tcp).
    restart: unless-stopped
    entrypoint:
      - /usr/bin/bash
      - -c
      - |
        until (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; do echo 'waiting for postgres...'; sleep 2; done
        until (exec 3<>/dev/tcp/redis/6379) 2>/dev/null; do echo 'waiting for redis...'; sleep 2; done
        echo 'postgres + redis reachable — starting'
        exec java -jar app.jar
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nearmedb
      SPRING_DATASOURCE_USERNAME: nearme
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Optional: free EIA key (https://www.eia.gov/opendata/) enables average
      # gas prices. Set NEARME_EIA_API_KEY in your shell before `docker compose up`.
      NEARME_EIA_API_KEY: ${NEARME_EIA_API_KEY:-}
      NEARME_EIA_DUOAREA: ${NEARME_EIA_DUOAREA:-NUS}
      # Auth (client-credentials JWT) — values come from .env (see .env.example).
      # The app's AUTH_CLIENT_SECRET must match NEARME_AUTH_CLIENT_SECRET.
      NEARME_AUTH_CLIENT_SECRET: ${NEARME_AUTH_CLIENT_SECRET}
      NEARME_JWT_SECRET: ${NEARME_JWT_SECRET}
      NEARME_JWT_TTL_SECONDS: ${NEARME_JWT_TTL_SECONDS:-3600}
    ports:
      - "28585:28585"
    networks:
      - shared-net

networks:
  shared-net:
    external: true
