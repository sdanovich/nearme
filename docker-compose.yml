services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nearme-postgres
    # Restart on crash and on Docker daemon start (i.e. after a host reboot),
    # unless the container was explicitly stopped.
    restart: unless-stopped
    environment:
      POSTGRES_DB: nearmedb
      POSTGRES_USER: nearme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearme -d nearmedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nearme-net

  redis:
    image: redis:7
    container_name: nearme-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nearme-net

  backend:
    build: ./backend
    container_name: nearme-backend
    # On a host reboot the daemon starts containers per their restart policy but
    # does NOT honor depends_on health ordering; if backend starts before
    # postgres is ready it exits and this policy restarts it until the DB is up.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nearmedb
      SPRING_DATASOURCE_USERNAME: nearme
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Optional: free EIA key (https://www.eia.gov/opendata/) enables average
      # gas prices. Set NEARME_EIA_API_KEY in your shell before `docker compose up`.
      NEARME_EIA_API_KEY: ${NEARME_EIA_API_KEY:-}
      NEARME_EIA_DUOAREA: ${NEARME_EIA_DUOAREA:-NUS}
      # Auth (client-credentials JWT) — values come from .env (see .env.example).
      # The app's AUTH_CLIENT_SECRET must match NEARME_AUTH_CLIENT_SECRET.
      NEARME_AUTH_CLIENT_SECRET: ${NEARME_AUTH_CLIENT_SECRET}
      NEARME_JWT_SECRET: ${NEARME_JWT_SECRET}
      NEARME_JWT_TTL_SECONDS: ${NEARME_JWT_TTL_SECONDS:-3600}
    ports:
      - "28585:28585"
    networks:
      - nearme-net

volumes:
  postgres-data:
  redis-data:

networks:
  nearme-net:
    driver: bridge
