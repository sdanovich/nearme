# NearMe reverse proxy (nginx) — alternative to the Caddyfile.
#
# Unlike Caddy, nginx does not fetch certificates itself. Get one first, e.g.:
#   sudo certbot --nginx -d danovich.ddns.net
# (or use certbot in standalone/webroot mode and point the paths below at it).
#
# Prerequisites are the same as the Caddyfile: DNS -> public IP, router forwards
# 80/443 to this host, and the backend is reachable at 192.168.0.115:28585.
#
# Install at /etc/nginx/sites-available/nearme.conf and symlink into
# sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name danovich.ddns.net;

    # ACME HTTP-01 challenge (certbot webroot); redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name danovich.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/danovich.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danovich.ddns.net/privkey.pem;

    # Proxy the API to the backend. No trailing path on proxy_pass, so the
    # original URI (including the /api prefix) is preserved end-to-end.
    location /api/ {
        proxy_pass http://192.168.0.115:28585;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # nearby can be slow (Overpass discovery)
    }

    # Everything else is not part of the public surface.
    location / { return 404; }
}
