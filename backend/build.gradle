plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
    // Local platform-stack snapshots, for dev before/without GitHub Packages creds.
    mavenLocal()
    // Shared auth artifacts (com.danovich.platform:*). Only added when GitHub
    // Packages credentials are present (CI, or ~/.gradle/gradle.properties), so a
    // clone without a token still builds against mavenLocal.
    def gprUser = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
    def gprKey = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
    if (gprUser && gprKey) {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/sdanovich/platform-stack'
            credentials { username = gprUser; password = gprKey }
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // PostGIS geo support: Hibernate Spatial maps Point columns and enables
    // distance queries; the JTS library provides the geometry types.
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // Flyway for versioned schema (incl. the PostGIS extension + spatial index).
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Client-credentials JWT auth from the shared platform-stack module, consumed
    // as a published artifact (JwtService + enforcing servlet filter + POST
    // /api/auth/token, wired by its Spring autoconfiguration). Brings jjwt
    // transitively. SNAPSHOT tracks the latest fix published from platform-stack.
    implementation 'com.danovich.platform:backend-auth:0.1.0-SNAPSHOT'

    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') { useJUnitPlatform() }
