spring.application.name=nearme-backend
server.port=28585

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nearmedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nearme}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nearme}

# Flyway owns the schema (incl. PostGIS); Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate Spatial dialect for PostGIS geometry/geography types.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Redis (error-event broker) ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# --- EIA fuel prices (optional) ---
# Free API key from https://www.eia.gov/opendata/ . If blank, gas prices stay
# blank until crowdsourced. The region is normally derived from the request's
# coordinates (RegionResolver); nearme.eia.duoarea is only the FALLBACK used
# outside the US or when geocoding fails (NUS = national average).
nearme.eia.api-key=${NEARME_EIA_API_KEY:}
nearme.eia.duoarea=${NEARME_EIA_DUOAREA:NUS}
nearme.eia.endpoint=${NEARME_EIA_ENDPOINT:https://api.eia.gov/v2/petroleum/pri/gnd/data/}
# Reverse-geocoder used to map coordinates -> US state -> EIA region.
nearme.nominatim.endpoint=${NEARME_NOMINATIM_ENDPOINT:https://nominatim.openstreetmap.org/reverse}

# --- Auth (client-credentials JWT) ---
# The app exchanges this shared secret at POST /api/auth/token for a short-lived
# JWT, then sends it as `Authorization: Bearer <jwt>` on every /api/** call.
# CHANGE BOTH of these in production (env vars below).
nearme.auth.client-secret=${NEARME_AUTH_CLIENT_SECRET:nearme-dev-client-secret-change-me}
# HS256 signing key for issued JWTs — MUST be at least 32 bytes.
nearme.jwt.secret=${NEARME_JWT_SECRET:dev-only-jwt-signing-secret-change-me-please-32+}
nearme.jwt.ttl-seconds=${NEARME_JWT_TTL_SECONDS:3600}
nearme.jwt.issuer=${NEARME_JWT_ISSUER:nearme-backend}
